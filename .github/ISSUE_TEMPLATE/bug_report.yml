name: Bug report
description: Report a reproducible problem with E-commerce Support Agent
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: LLM provider and model
      placeholder: OpenAI-compatible endpoint + model name (no API keys!)
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the user message, relevant demo order/policy and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and guardrail
      description: Mention any reliability guardrail that should have applied.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste sanitized logs; remove API keys, tokens and personal data.
    validations:
      required: true